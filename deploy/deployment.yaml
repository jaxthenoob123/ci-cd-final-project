apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-cd-final-project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ci-cd-final-project
  template:
    metadata:
      labels:
        app: ci-cd-final-project
    spec:
      containers:
        - name: ci-cd-final-project
          image: image-registry.openshift-image-registry.svc:5000/sn-labs-h591990/ci-cd-final-project:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: ci-cd-final-project
spec:
  selector:
    app: ci-cd-final-project
  ports:
    - port: 8080
      targetPort: 8080
